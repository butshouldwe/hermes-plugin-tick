name: ci

# Public CI on GitHub-hosted runners. Same checks as .forgejo/workflows/ci.yml.
# Actions are pinned to full commit SHAs; the tag is in the trailing comment.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Toolchain
        run: python -m pip install --quiet 'pytest==8.4.2' 'pyyaml==6.0.3' 'fastapi==0.133.1' 'starlette==1.3.1' 'httpx==0.28.1'

      - name: Syntax
        run: |
          python -m py_compile __init__.py dashboard/plugin_api.py
          node --check desktop/plugin.js

      - name: Tests
        run: |
          set -euo pipefail
          python -m pytest -q tests/ | tee /tmp/pytest.out
          grep -Eq '[1-9][0-9]* passed' /tmp/pytest.out
          if grep -Eq ' skipped' /tmp/pytest.out; then echo "skipped tests in CI: dependency missing"; exit 1; fi

      - name: Desktop tests
        run: node --test 'tests/js/*.test.mjs'

  validate:
    # `hermes plugins validate` is the Hermes plugin-catalog gate. It runs in
    # the official Hermes image pinned by digest (stable, v0.21.6, 818c13be),
    # because Hermes does not ship as a pip-installable package.
    # Stricter than the catalog: any warning fails, so a declared-but-missing
    # tool or hook cannot pass.
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: nousresearch/hermes-agent@sha256:9774f4f39a9bb8c2f68ce728ed5e99ddbad282163be56764afacf88ed952b784
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: hermes plugins validate
        env:
          HERMES_HOME: /tmp/hermes-home
        run: |
          set -euo pipefail
          hermes --version
          hermes plugins validate . | tee /tmp/validate.txt
          hermes plugins validate --json . > /tmp/validate.json
          python3 - <<'PY'
          import json, sys
          d = json.load(open("/tmp/validate.json"))
          failed = [c["name"] for c in d["checks"] if not c["ok"]]
          if not d["ok"] or failed or d["warnings"]:
              print("validate failed:", failed, d["warnings"])
              sys.exit(1)
          print("validate ok, no warnings")
          PY
